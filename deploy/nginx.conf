server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # css/js : le navigateur revérifie à chaque visite (ETag), les mises à jour s'affichent tout de suite
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(svg|png|jpe?g|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.pdf$ {
        add_header Content-Disposition "inline";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
