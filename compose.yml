# Lancement local : docker compose up --build  ->  http://localhost:8080
services:
  portfolio:
    build: .
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
